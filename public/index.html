<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Premium de Gestão de Academia</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-badge">SP</span>
          <div>
            <strong>Sistema Premium</strong>
            <p>Gestão de Academia</p>
          </div>
        </div>
        <nav id="sidebar-menu" class="menu"></nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sistema configurável</p>
            <h1 id="page-title">Painel</h1>
          </div>
          <div class="topbar-actions">
            <button id="reload-button" class="button ghost">Recarregar</button>
            <button id="reset-button" class="button danger">Zerar sistema</button>
          </div>
        </header>

        <section class="hero-card">
          <div>
            <span class="hero-tag">Base funcional local</span>
            <h2 id="module-title">Carregando...</h2>
            <p id="module-subtitle"></p>
          </div>
          <div class="hero-note">
            <strong>Status operacional</strong>
            <ul id="hero-status-list"></ul>
          </div>
        </section>

        <section id="alerts" class="alerts"></section>
        <section id="module-body" class="module-body"></section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
